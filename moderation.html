<!DOCTYPE html>
<html lang="fr">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5P9NMJ49"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-SSS4EVD5M4');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Modération – GeoGuessr CentraleSupélec</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#10252d; --paper:#f5f6f2; --line:#c9d0cb; --signal:#f0b429; --good:#2f9e6b; --bad:#d2493f;
          --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--ink); color: var(--paper); min-height: 100vh; }
  main { max-width: 1000px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 1.7rem; font-weight: 800; margin: .5rem 0 1rem; }
  a { color: var(--signal); }
  .box { background: rgba(255,255,255,.06); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin: .8rem 0 .3rem; }
  input[type=email], input[type=password] { width: 100%; max-width: 380px; padding: .75rem; border-radius: 10px; border: 2px solid var(--line); font: 600 1rem var(--font); background: #fff; color: var(--ink); }
  button { font: 800 .95rem var(--font); border: 0; border-radius: 10px; padding: .7rem 1rem; cursor: pointer; background: var(--signal); color: var(--ink); }
  button.ghost { background: rgba(255,255,255,.12); color: var(--paper); }
  button.good { background: var(--good); color: #fff; }
  button.bad { background: var(--bad); color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .bar .sp { flex: 1; }
  .tab[aria-pressed=true] { background: var(--signal); color: var(--ink); }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
  .card { background: var(--paper); color: var(--ink); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; height: 260px; object-fit: cover; display: block; background: #0a1a20; }
  .card .map { height: 240px; }
  .card .info { padding: .75rem 1rem 0; font-size: .9rem; color: #3b4c47; }
  .card .info b { color: var(--ink); }
  .card .actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: .75rem 1rem 1rem; }
  .moved { color: #a05a00; font-weight: 700; }
  #msg { margin: .5rem 0 1rem; font-weight: 600; min-height: 1.4em; }
  .empty { color: #c3cec9; padding: 1rem 0; }
</style>
</head>
<body>
<main>
  <a href="index.html">Retour au jeu</a>
  <h1>Modération des photos</h1>
  <div id="msg" role="status" aria-live="polite"></div>

  <section id="login" class="box">
    <form id="loginForm">
      <label for="email">E-mail du compte admin</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pass">Mot de passe</label>
      <input id="pass" type="password" autocomplete="current-password" required>
      <p><button type="submit" id="loginBtn">Se connecter</button></p>
    </form>
  </section>

  <section id="panel" style="display:none">
    <div class="bar">
      <button class="tab" id="tabPending" type="button" aria-pressed="true">En attente</button>
      <button class="tab ghost" id="tabApproved" type="button" aria-pressed="false">Validées</button>
      <span class="sp" id="count"></span>
      <button class="ghost" id="reload" type="button">Actualiser</button>
      <button class="ghost" id="logout" type="button">Se déconnecter</button>
    </div>
    <div class="grid" id="list"></div>
    <p style="text-align:center"><button class="ghost" id="moreBtn" type="button" hidden>Charger plus de photos</button></p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const configured = typeof SUPABASE_URL === "string" && typeof SUPABASE_KEY === "string"
  && !SUPABASE_URL.includes("VOTRE-PROJET") && !SUPABASE_KEY.includes("VOTRE_CLE");
const root = configured ? SUPABASE_URL.replace(/\/$/, "") : "";
let token = null;
try { token = sessionStorage.getItem("mod_token"); } catch {}
let view = "pending";
let maps = [];

function say(text, ok) { $("msg").style.color = ok === true ? "#7fe0ae" : ok === false ? "#ff8f86" : ""; $("msg").textContent = text || ""; }

function api(path, opts = {}) {
  return fetch(root + path, { ...opts, headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token, ...(opts.headers || {}) } });
}

function showLogin(note) {
  token = null; try { sessionStorage.removeItem("mod_token"); } catch {}
  $("login").style.display = ""; $("panel").style.display = "none";
  say(note, note ? false : undefined);
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!configured) return say("Supabase n’est pas configuré : remplis config.js.", false);
  $("loginBtn").disabled = true; say("Connexion…");
  try {
    const r = await fetch(root + "/auth/v1/token?grant_type=password", {
      method: "POST", headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), password: $("pass").value })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error_description || j.msg || ("HTTP " + r.status));
    token = j.access_token;
    try { sessionStorage.setItem("mod_token", token); } catch {}
    $("pass").value = "";
    say("");
    enter();
  } catch (err) { say("Connexion impossible : " + err.message, false); }
  $("loginBtn").disabled = false;
});

$("logout").addEventListener("click", () => showLogin("Déconnecté."));
$("reload").addEventListener("click", () => load());
$("tabPending").addEventListener("click", () => setView("pending"));
$("tabApproved").addEventListener("click", () => setView("approved"));

function setView(v) {
  view = v;
  $("tabPending").setAttribute("aria-pressed", v === "pending");
  $("tabApproved").setAttribute("aria-pressed", v === "approved");
  $("tabPending").classList.toggle("ghost", v !== "pending");
  $("tabApproved").classList.toggle("ghost", v !== "approved");
  load();
}

function enter() { $("login").style.display = "none"; $("panel").style.display = ""; load(); }

function tiles() {
  const ign = L.tileLayer("https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}",
    { maxNativeZoom: 19, maxZoom: 20, attribution: "© IGN / Géoplateforme" });
  const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
  return { ign, osm };
}

const PAGE = 20;
let offset = 0, total = null;

function updateCount() {
  const shown = $("list").querySelectorAll(".card").length;
  const label = view === "pending" ? "en attente" : "validée(s)";
  $("count").textContent = shown ? (total !== null ? shown + " / " + total : shown) + " " + label : "";
  $("moreBtn").hidden = !shown || (total !== null ? offset >= total : shown % PAGE !== 0);
}

// reset = true : repart de la première page ; false : ajoute la page suivante
async function load(reset = true) {
  if (reset) {
    say("Chargement…");
    maps.forEach((m) => m.remove()); maps = [];
    $("list").textContent = "";
    offset = 0; total = null; $("moreBtn").hidden = true;
  }
  $("moreBtn").disabled = true;
  try {
    const filter = view === "pending" ? "approved=eq.false&order=created_at.asc" : "approved=eq.true&order=created_at.desc";
    const r = await api("/rest/v1/photos?select=id,created_at,lat,lng,path&" + filter + "&limit=" + PAGE + "&offset=" + offset,
      { headers: { Prefer: "count=exact" } });
    if (r.status === 401) return showLogin("Session expirée, reconnecte-toi.");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const n = parseInt((r.headers.get("Content-Range") || "").split("/")[1], 10);
    if (!isNaN(n)) total = n;
    const rows = await r.json();
    say("");
    if (!rows.length && reset) {
      const d = document.createElement("p"); d.className = "empty";
      d.textContent = view === "pending"
        ? "Aucune photo en attente. (Si tu sais qu’il y en a, vérifie que moderation.sql a été exécuté avec ton adresse e-mail.)"
        : "Aucune photo validée.";
      $("list").appendChild(d); $("count").textContent = ""; return;
    }
    rows.forEach(addCard);
    offset += rows.length;
    updateCount();
  } catch (err) { say("Chargement impossible : " + err.message, false); }
  finally { $("moreBtn").disabled = false; }
}

$("moreBtn").addEventListener("click", () => load(false));

function btn(text, cls, fn) {
  const b = document.createElement("button"); b.type = "button"; b.textContent = text; if (cls) b.className = cls;
  b.addEventListener("click", () => fn(b)); return b;
}

function addCard(p) {
  const card = document.createElement("article"); card.className = "card";
  const url = root + "/storage/v1/object/public/photos/" + p.path;

  const a = document.createElement("a"); a.href = url; a.target = "_blank"; a.rel = "noopener";
  const img = document.createElement("img"); img.src = url; img.loading = "lazy"; img.alt = "Photo proposée"; a.appendChild(img);

  const mapDiv = document.createElement("div"); mapDiv.className = "map";

  const info = document.createElement("p"); info.className = "info";
  const when = new Date(p.created_at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
  const coords = document.createElement("span");
  const moved = document.createElement("span"); moved.className = "moved";
  coords.innerHTML = "";
  const b1 = document.createElement("b"); b1.textContent = p.lat.toFixed(5) + ", " + p.lng.toFixed(5);
  coords.append("Point : ", b1, " · envoyée le " + when + ". ");
  info.append(coords, moved);
  info.append(document.createElement("br"), "Clique sur la carte pour corriger la position si besoin.");

  const actions = document.createElement("div"); actions.className = "actions";
  let newPt = null;

  const done = () => {
    card.remove(); offset = Math.max(0, offset - 1); if (total !== null) total = Math.max(0, total - 1);
    if (!$("list").querySelector(".card")) load(); else updateCount();
  };

  async function patch(b, body, okText) {
    b.disabled = true;
    try {
      const r = await api("/rest/v1/photos?id=eq." + p.id, { method: "PATCH", headers: { "Content-Type": "application/json", Prefer: "return=representation" }, body: JSON.stringify(body) });
      if (r.status === 401) return showLogin("Session expirée, reconnecte-toi.");
      if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 150));
      if (!(await r.json()).length) throw new Error("aucune ligne modifiée (moderation.sql exécuté avec la bonne adresse ?)");
      say(okText, true); return true;
    } catch (err) { say("Échec : " + err.message, false); b.disabled = false; }
  }

  async function remove(b) {
    if (!confirm("Supprimer définitivement cette photo ?")) return;
    b.disabled = true;
    try {
      const r = await api("/rest/v1/photos?id=eq." + p.id, { method: "DELETE", headers: { Prefer: "return=representation" } });
      if (r.status === 401) return showLogin("Session expirée, reconnecte-toi.");
      if (!r.ok) throw new Error("HTTP " + r.status);
      if (!(await r.json()).length) throw new Error("aucune ligne supprimée (moderation.sql exécuté avec la bonne adresse ?)");
      const f = await api("/storage/v1/object/photos/" + encodeURIComponent(p.path), { method: "DELETE" });
      say(f.ok ? "Photo supprimée." : "Ligne supprimée, mais le fichier est resté dans Storage (à supprimer à la main).", f.ok);
      done();
    } catch (err) { say("Échec : " + err.message, false); b.disabled = false; }
  }

  const coordsBody = () => newPt ? { lat: +newPt.lat.toFixed(6), lng: +newPt.lng.toFixed(6) } : {};

  if (view === "pending") {
    actions.append(
      btn("Valider", "good", async (b) => { if (await patch(b, { approved: true, ...coordsBody() }, "Photo validée : elle apparaît dans le jeu.")) done(); }),
      btn("Refuser", "bad", remove)
    );
  } else {
    const save = btn("Enregistrer le nouveau point", "", async (b) => { if (await patch(b, coordsBody(), "Point mis à jour.")) { b.hidden = true; b.disabled = false; } });
    save.hidden = true;
    actions.append(save, btn("Retirer du jeu", "bad", remove));
    card._save = save;
  }

  card.append(a, mapDiv, info, actions);
  $("list").appendChild(card);

  const t = tiles();
  const map = L.map(mapDiv, { center: [p.lat, p.lng], zoom: 18, layers: [t.ign] });
  L.control.layers({ "Satellite IGN": t.ign, "Plan": t.osm }).addTo(map);
  const marker = L.circleMarker([p.lat, p.lng], { radius: 8, color: "#10252d", weight: 3, fillColor: "#f0b429", fillOpacity: 1 }).addTo(map);
  map.on("click", (e) => {
    newPt = e.latlng; marker.setLatLng(newPt);
    moved.textContent = "Nouveau point : " + newPt.lat.toFixed(5) + ", " + newPt.lng.toFixed(5) + (view === "pending" ? " (sera enregistré à la validation)." : ".");
    if (card._save) card._save.hidden = false;
  });
  maps.push(map);
  setTimeout(() => map.invalidateSize(), 50);
}

if (!configured) say("Supabase n’est pas configuré : remplis config.js (URL et clé).", false);
else if (token) enter();
</script>
</body>
</html>
