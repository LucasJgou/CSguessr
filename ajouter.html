<!DOCTYPE html>
<html lang="fr">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5P9NMJ49"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Proposer une photo – GeoGuessr CentraleSupélec</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#10252d; --paper:#f5f6f2; --line:#c9d0cb; --signal:#f0b429; --good:#2f9e6b; --bad:#d2493f;
          --font:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--ink); color: var(--paper); min-height: 100vh; }
  main { max-width: 760px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
  h1 { font-size: 1.7rem; font-weight: 800; margin: .5rem 0 .25rem; }
  p.lead { margin: 0 0 1.25rem; color: #c3cec9; max-width: 60ch; }
  a { color: var(--signal); }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .step { background: rgba(255,255,255,.06); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
  .step h2 { font-size: 1.05rem; margin: 0 0 .6rem; }
  input[type=file] { width: 100%; padding: .7rem; border: 1px dashed var(--line); border-radius: 10px; background: transparent; color: var(--paper); font: inherit; }
  #preview { display: none; width: 100%; max-height: 280px; object-fit: contain; margin-top: .75rem; border-radius: 10px; background: #0a1a20; }
  #map { height: 360px; border-radius: 12px; }
  #send { width: 100%; border: 0; border-radius: 12px; padding: 1rem; font: 800 1.05rem var(--font); background: var(--signal); color: var(--ink); cursor: pointer; }
  #send:disabled { background: var(--line); color: #6a7771; cursor: not-allowed; }
  #send:focus-visible, input:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  #msg { margin-top: .9rem; font-weight: 600; min-height: 1.4em; }
  button.alt { border: 0; border-radius: 10px; padding: .7rem 1rem; font: 700 .95rem var(--font); background: var(--paper); color: var(--ink); cursor: pointer; }
  .hint { font-size: .9rem; color: #c3cec9; margin: .5rem 0 0; }
</style>
</head>
<body>
<main>
  <div class="topbar"><a href="index.html" data-i18n="back">Retour au jeu</a><span data-langswitch></span></div>
  <h1 data-i18n="add.title">Proposer une photo</h1>
  <p class="lead" data-i18n="add.lead">Dépose ta photo, place le point exact où elle a été prise, puis envoie. Ta proposition sera vérifiée avant d’apparaître dans le jeu.</p>

    <div class="step">
    <h2 data-i18n="add.step1">1. Choisis ta photo</h2>
    <input type="file" id="file" accept="image/*">
    <img id="preview" data-i18n-alt="add.preview" alt="">
    
  </div>

  <div class="step">
    <h2 data-i18n="add.step2">2. Place le point exact</h2>
    <div id="map"></div>
    <p class="hint" id="coords"></p>
  </div>

  <button id="send" type="button" disabled data-i18n="add.send">Envoyer la photo</button>
    <div id="msg" role="status" aria-live="polite"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
const CENTER = [48.7099, 2.1693];
const MAX_SIDE = 1600;
const MAX_BYTES = 1400000; // le stockage Supabase refuse au-delà de 1,5 Mo
const $ = (id) => document.getElementById(id);
let blob = null, point = null, marker = null, added = 0;

const ign = L.tileLayer(
  "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}",
  { maxNativeZoom: 19, maxZoom: 20, attribution: "© IGN / Géoplateforme" }
);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 19, attribution: "© Esri" });
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom: 19, attribution: "© OpenStreetMap" });
const map = L.map("map", { center: CENTER, zoom: 16, layers: [ign] });
L.control.layers({ "Satellite IGN": ign, "Satellite Esri": sat, "OpenStreetMap": osm }).addTo(map);

map.on("click", (e) => {
  point = e.latlng;
  if (marker) marker.setLatLng(point);
  else marker = L.circleMarker(point, { radius: 8, color: "#10252d", weight: 3, fillColor: "#f0b429", fillOpacity: 1 }).addTo(map);
  renderCoords();
  refresh();
});

// Réduit la photo à 1600 px max et la ré-encode en JPEG (retire aussi les données EXIF, dont le GPS du téléphone)
async function compress(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  let k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height)), q = 0.82;
  for (let essai = 0; ; essai++) {
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise((res) => c.toBlob(res, "image/jpeg", q));
    if (b.size <= MAX_BYTES || essai >= 4) return b;
    q = Math.max(0.5, q - 0.1); k *= 0.85;
  }
}

$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  blob = null; $("preview").style.display = "none"; $("msg").textContent = "";
  if (!f) return refresh();
  try {
    blob = await compress(f);
    $("preview").src = URL.createObjectURL(blob);
    $("preview").style.display = "block";
  } catch { $("msg").textContent = tr("add.badFormat"); }
  refresh();
});

function renderCoords() {
  $("coords").textContent = point
    ? tr("add.placed", { lat: point.lat.toFixed(5), lng: point.lng.toFixed(5) })
    : tr("add.hint");
}
document.addEventListener("langchange", renderCoords);
renderCoords();

function refresh() { $("send").disabled = !(blob && point); }

// Envoi vers Supabase : la photo va dans le stockage, les coordonnées dans la table « photos » (approved = false).
const configured = typeof SUPABASE_URL === "string" && typeof SUPABASE_KEY === "string"
  && !SUPABASE_URL.includes("VOTRE-PROJET") && !SUPABASE_KEY.includes("VOTRE_CLE");

function resetForm() {
  $("file").value = ""; blob = null; $("preview").style.display = "none";
  if (marker) { map.removeLayer(marker); marker = null; } point = null;
  renderCoords();
  refresh();
}

function fail(text) { $("msg").style.color = "#ff8f86"; $("msg").textContent = text; refresh(); }

$("send").addEventListener("click", async () => {
  if (!configured) return fail(tr("add.noConfig"));
  // Même zone que la règle SQL : évite un rejet incompréhensible
  if (point.lat < 48.69 || point.lat > 48.73 || point.lng < 2.14 || point.lng > 2.20)
    return fail(tr("add.outside"));

  $("send").disabled = true;
  $("msg").style.color = ""; $("msg").textContent = tr("add.sending");
  const root = SUPABASE_URL.replace(/\/$/, "");
  const auth = { apikey: SUPABASE_KEY, ...(SUPABASE_KEY.startsWith("eyJ") ? { Authorization: "Bearer " + SUPABASE_KEY } : {}) };
  const path = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) + ".jpg";

  try {
    // 1. la photo
    const up = await fetch(root + "/storage/v1/object/photos/" + path, {
      method: "POST", headers: { ...auth, "Content-Type": "image/jpeg" }, body: blob
    });
    if (!up.ok) throw new Error(tr("add.upRefused", { s: up.status }));
    // 2. les coordonnées
    const ins = await fetch(root + "/rest/v1/photos", {
      method: "POST",
      headers: { ...auth, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ lat: +point.lat.toFixed(6), lng: +point.lng.toFixed(6), path })
    });
    if (!ins.ok) throw new Error(tr("add.insRefused", { s: ins.status }));

    $("msg").style.color = "#7fe0ae";
    $("msg").textContent = tr("add.sent");
    resetForm();
  } catch (err) {
    fail(tr("add.fail", { err: err.message || tr("add.conn") }));
  }
});
</script>
</body>
</html>
